name: Playwright Tests

on:
  pull_request:
    branches: [preview]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 브라우저는 설치된 @playwright/test 버전에 맞춰 받는다. 고정 버전 컨테이너 이미지를 쓰면 패키지만 올라갔을 때 브라우저를 찾지 못한다.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js app
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Publish Test Results (PR comment - playwright)
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
        with:
          files: test-results/junit.xml
          comment_mode: always
          comment_title: "Playwright Test Results"
          check_name: "Playwright Test Results"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
